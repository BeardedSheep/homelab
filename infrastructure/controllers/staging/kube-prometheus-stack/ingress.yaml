apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  ingressClassName: traefik
  rules:
    - host: grafana.beardedsheep.uk
      http:
        paths:
          - backend:
              service:
                name: kube-prometheus-stack
                port:
                  number: 3000
            path: /
            pathType: Prefix
