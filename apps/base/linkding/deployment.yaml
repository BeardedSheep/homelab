apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
spec:
  replica: 1
  selector:
    matchLabels:
      app: linkding
  template:
    metadata:
      labels:
        app: linkding
    spec:
      containers:
        - name: linkding
          image: sissbruecker/linkding:1.47.0
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: linkding-data
              mountPath: /etc/linkding/data
      volume:
        - name: linkding-data-pvc
          persistentVolumeClaim:
            claimName: linkding-data-pvc
