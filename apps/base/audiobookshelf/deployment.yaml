apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
spec:
  replica: 1
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
#      securityContext:
#        fsGroup: 33 # www-data group ID
#        runAsUser: 33 # www-data user ID
#        runAsGroup: 33 # www-data group ID

      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:2.38.0
          ports:
            - containerPort: 3005

#          envFrom:
#          #  - configMapRef:
#          #      name: linkding-configmap
#            - secretRef:
#                name: linkding-container-env

#          securityContext:
#            allowPrivilegeEscalation: false

          volumeMounts:
            - name: audiobookshelf-data
              mountPath: /etc/audiobookshelf/data
#      volumes:
#        - name: linkding-data
#          persistentVolumeClaim:
#            claimName: linkding-data-pvc
