apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
  labels:
    app: audiobookshelf
spec:
  replicas: 1          # Keep at 1: the app uses a SQLite database
  strategy:
    type: Recreate     # Stop the old pod before starting the new one
  selector:
    matchLabels:
      app: audiobookshelf
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      # To run as a different user (compose "user: 1000:1000"), uncomment.
      # If the app then can't bind port 80, set a PORT env var such as 8080
      # and change containerPort to match.
      # securityContext:
      #   runAsUser: 1000
      #   runAsGroup: 1000
      #   fsGroup: 1000
      containers:
        - name: audiobookshelf
          image: ghcr.io/advplyr/audiobookshelf:2.38.0
          imagePullPolicy: Always
