apiVersion: apps/v1
kind: Deployment
metadata:
  name: abs
spec:
  replica: 1
  selector:
    matchLabels:
      app: abs
  template:
    metadata:
      labels:
        app: abs
    spec:
#      securityContext:
#        fsGroup: 33 # www-data group ID
#        runAsUser: 33 # www-data user ID
#        runAsGroup: 33 # www-data group ID

      containers:
        - name: abs
          image: ghcr.io/advplyr/audiobookshelf:2.38.0
          ports:
            - containerPort: 3005

          envFrom:
            - configMapRef:
                name: abs-configmap
