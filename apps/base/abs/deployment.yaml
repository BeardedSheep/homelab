apiVersion: apps/v1
kind: Deployment
metadata:
  name: abs
spec:
  replica: 1
  selector:
    matchLabels:
      app: abs
  template:
    metadata:
      labels:
        app: abs
    spec:
      securityContext:
        fsGroup: 1000 # node group ID
        runAsUser: 1000 # node user ID
        runAsGroup: 1000 # node group ID

      containers:
        - name: abs
          image: ghcr.io/advplyr/audiobookshelf:2.38.0
          ports:
            - containerPort: 3005

          envFrom:
            - configMapRef:
                name: abs-configmap
#            - secretRef:
#                name: linkding-container-env

#          securityContext:
#            allowPrivilegeEscalation: false

          volumeMounts:
            - name: abs-config
              mountPath: /config
            - name: abs-metadata
              mountPath: /metadata
            - name: abs-audiobooks
              mountPath: /audiobooks
            - name: abs-podcasts
              mountPath: /podcasts

      volumes:
        - name: abs-config
          persistentVolumeClaim:
            claimName: abs-config
        - name: abs-metadata
          persistanceVolumeClaim:
            claimName: abs-metadata
        - name: abs-audiobooks
          persistanceVolumeClaim:
            claimName: abs-audiobooks
        - name: abs-podcasts
          persistanceVolumeClaim:
            claimName: abs-podcasts
